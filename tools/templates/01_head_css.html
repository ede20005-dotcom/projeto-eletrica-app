<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity — Plataforma Integrada de Engenharia Elétrica & Renováveis (NBR 5410 / NBR 16690)</title>
  <!-- Three.js e OrbitControls para visualização 3D WebGL 100% Offline com Fallback CDN -->
  <script src="static/js/three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
    }
  </script>
  <script src="static/js/OrbitControls.js"></script>
  <script>
    if (typeof THREE !== 'undefined' && typeof THREE.OrbitControls === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>');
    }
  </script>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --bg-sidebar: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-yellow: #f59e0b;
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-purple: #c084fc;
      --accent-cyan: #06b6d4;
      --border-color: #334155;
      --sidebar-width: 290px;
      --sidebar-collapsed: 60px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    #app-container {
      display: flex;
      width: 100vw;
      min-height: 100vh;
      overflow: hidden;
    }

    /* SIDEBAR (MENU LATERAL HIERÁRQUICO) */
    aside#sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 1000;
      user-select: none;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.4);
    }
    aside#sidebar.collapsed {
      width: var(--sidebar-collapsed);
    }

    .sidebar-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: #090d16;
      min-height: 60px;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      white-space: nowrap;
    }
    .sidebar-logo {
      background: var(--accent-yellow);
      color: #000;
      font-weight: 900;
      font-size: 16px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }
    .sidebar-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    .sidebar-title small {
      font-size: 10px;
      color: var(--accent-yellow);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-toggle-sidebar {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-toggle-sidebar:hover {
      background: var(--bg-hover);
      color: #fff;
    }

    .sidebar-search-box {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      background: #0d1322;
    }
    .sidebar-search-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 7px 10px;
      color: #fff;
      font-size: 11px;
      outline: none;
      transition: border-color 0.2s;
    }
    .sidebar-search-input:focus {
      border-color: var(--accent-yellow);
    }
    aside#sidebar.collapsed .sidebar-search-box,
    aside#sidebar.collapsed .sidebar-title {
      display: none;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
    }
    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    .nav-group {
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 2px;
    }
    .nav-group-header {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      background: transparent;
      border-radius: 6px;
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .nav-group-header:hover {
      background: var(--bg-hover);
    }
    .nav-group-header.open {
      color: var(--accent-yellow);
      background: rgba(245, 158, 11, 0.08);
    }
    .nav-group-title {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-group-icon {
      font-size: 15px;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }
    .nav-group-arrow {
      font-size: 9px;
      color: var(--text-muted);
      transition: transform 0.2s;
    }
    .nav-group-header.open .nav-group-arrow {
      transform: rotate(90deg);
    }
    aside#sidebar.collapsed .nav-group-header .nav-group-arrow,
    aside#sidebar.collapsed .nav-group-header span:not(.nav-group-icon) {
      display: none;
    }

    .nav-subitems {
      display: none;
      flex-direction: column;
      padding-left: 14px;
      margin: 4px 0 6px 0;
      border-left: 2px solid #334155;
      gap: 2px;
    }
    .nav-group.open .nav-subitems {
      display: flex;
    }
    aside#sidebar.collapsed .nav-subitems {
      display: none !important;
    }
    .nav-subitem {
      padding: 7px 10px;
      font-size: 11px;
      color: var(--text-muted);
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-subitem:hover {
      color: #fff;
      background: var(--bg-hover);
    }
    .nav-subitem.active {
      color: var(--accent-yellow);
      font-weight: 700;
      background: rgba(245, 158, 11, 0.12);
    }
    .nav-subitem-badge {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 4px;
      background: #334155;
      color: #e2e8f0;
      margin-left: auto;
    }

    /* CONTEÚDO PRINCIPAL & CABEÇALHO */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg-dark);
      overflow-y: auto;
      height: 100vh;
    }

    header {
      background: #090d16;
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-brand {
      display: flex;
      flex-direction: column;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #fff;
    }
    .brand-subtitle {
      font-size: 10px;
      color: var(--accent-yellow);
      font-weight: 600;
    }
    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent-yellow); color: #000; font-weight: 700; }
    .btn-primary:hover { background: #d97706; }
    .btn-green { background: var(--accent-green); color: #000; font-weight: 700; }
    .btn-green:hover { background: #059669; color: #fff; }
    .btn-blue { background: #0284c7; color: #fff; }
    .btn-blue:hover { background: #0369a1; }
    .btn-outline { background: transparent; border-color: var(--border-color); color: var(--text-main); }
    .btn-outline:hover { background: var(--bg-card); }

    /* Barra Superior de Abas com Scrollbar Fina */
    .tabs-nav {
      background: #111827;
      display: flex;
      border-bottom: 1px solid var(--border-color);
      padding: 0 16px;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
      flex-shrink: 0;
    }
    .tabs-nav::-webkit-scrollbar { height: 4px; }
    .tabs-nav::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .tabs-nav::-webkit-scrollbar-track { background: #0f172a; }

    .tab-btn {
      padding: 10px 14px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn:hover { color: var(--text-main); }
    .tab-btn.active {
      color: var(--accent-yellow);
      border-bottom-color: var(--accent-yellow);
      background: rgba(245, 158, 11, 0.05);
    }

    main {
      flex: 1;
      padding: 20px;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: fadeIn 0.2s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Grid de Estatísticas e Cards */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .metric-title {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .metric-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
    }
    .metric-desc {
      font-size: 10px;
      color: var(--accent-yellow);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Tabelas de Engenharia */
    .table-container {
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
      text-align: left;
    }
    th {
      background: #0f172a;
      color: var(--text-muted);
      padding: 9px 12px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }
    td {
      padding: 9px 12px;
      border-bottom: 1px solid #1e293b;
      color: var(--text-main);
    }
    tr:nth-child(even) { background: rgba(30, 41, 59, 0.4); }
    tr:hover { background: rgba(245, 158, 11, 0.08); }

    .tag {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .tag-yellow { background: rgba(245, 158, 11, 0.2); color: var(--accent-yellow); border: 1px solid rgba(245, 158, 11, 0.3); }
    .tag-green { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
    .tag-blue { background: rgba(56, 189, 248, 0.2); color: var(--accent-blue); border: 1px solid rgba(56, 189, 248, 0.3); }
    .tag-red { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .tag-purple { background: rgba(192, 132, 252, 0.2); color: var(--accent-purple); border: 1px solid rgba(192, 132, 252, 0.3); }

    /* Canvas CAD e Gráficos */
    .cad-viewport {
      width: 100%;
      height: 540px;
      background: #050811;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }
    canvas.cad-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .cad-toolbar {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(4px);
    }

    /* Calculadora BDI */
    .bdi-calculator-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }
    .bdi-input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #0f172a;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .bdi-input-group label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .bdi-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bdi-slider {
      flex: 1;
      accent-color: var(--accent-yellow);
    }
    .bdi-val-display {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-yellow);
      min-width: 50px;
      text-align: right;
    }

    footer {
      background: #090d16;
      border-top: 1px solid var(--border-color);
      padding: 10px 20px;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }
    .heartbeat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      display: inline-block;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="app-container">
